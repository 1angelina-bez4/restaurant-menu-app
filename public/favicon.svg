<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Градиентный фон -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b65c20"/>
      <stop offset="100%" style="stop-color:#8a4515"/>
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="30" fill="url(#grad)"/>
  
  <!-- Внутренняя рамка -->
  <rect x="15" y="15" width="170" height="170" rx="20" fill="none" stroke="#fff" stroke-width="2" opacity="0.2"/>
  
  <!-- 🍽️ -->
  <text x="100" y="95" font-size="60" text-anchor="middle">🍽️</text>
  
  <!-- Название -->
  <text x="100" y="135" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Georgia, serif">Вкусный</text>
  <text x="100" y="160" font-size="14" text-anchor="middle" fill="#ffd4b8" font-family="Georgia, serif">уголок</text>
</svg>